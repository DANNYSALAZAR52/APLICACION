# Docker Compose de la demo.
#
# ESTADO: las bases de datos están COMENTADAS A PROPÓSITO (decisión del usuario, D-001 en
# docs/DECISIONES.md). La demo actual usa repositorios en memoria (DEMO-ONLY) y no necesita
# Docker. Este archivo no ha sido ejecutado ni validado: Docker no está instalado en el entorno
# de desarrollo actual (ver docs/REGISTRO_DEMO.md).
#
# Para activar la persistencia real: descomentar los servicios, completar las variables de
# entorno desde un .env local (nunca en Git; ver .env.example), implementar los adaptadores
# SQLAlchemy descritos en APP/Backend/src/fleetplanner/adapters/outbound/persistence_sql/ y
# declarar las migraciones Alembic `control_plane` y `tenant`.
#
# Tres contenedores PostgreSQL demuestran separación lógica y de instancia en local; NO equivalen
# a tres servidores físicos distintos.

services: {}

